name: Remove Source Comments

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REMOVE-COMMENTS to confirm"
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove-comments:
    if: inputs.confirm == 'REMOVE-COMMENTS'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Remove comments from supported source files
        run: python tools/remove-comments.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove source-code comments"
            git push
          else
            echo "No comment-only changes found."
          fi


name: Update Website URLs

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "https://intj-boy.github.io/purification-biomolecules/"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update URLs
        run: |
          python tools/set-url.py "${{ inputs.website_url }}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml robots.txt js/config.js README.md GUIDE-PUBLICATION.md PARTAGE-RESEAUX.md
          git diff --cached --quiet || git commit -m "Update website URLs"
          git push
